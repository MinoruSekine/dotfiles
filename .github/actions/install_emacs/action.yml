name: 'Install Emacs with cache'

inputs:
  job_id:
    required: true
    default: ${{ github.run_id }}-${{ github.job }}

runs:
  using: 'composite'
  steps:
    - name: Install Emacs by setup-scoop (cache supported version) (Windows)
      if: runner.os == 'Windows'
      uses: MinoruSekine/setup-scoop@main
      with:
        install_scoop: 'true'
        buckets: extras
        scoop_update: 'true'
        scoop_checkup: 'false'
        update_path: 'true'
        apps: extras/emacs
        cache: 'true'
        cache_key_suffix: ${{ inputs.job_id }}

    - name: Install Emacs (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository ppa:ubuntuhandbook1/emacs
        sudo apt update
        sudo apt install --no-install-recommends emacs emacs-common

    - name: Install Emacs (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew update
        brew install --cask emacs-app
